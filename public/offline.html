<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode — Tibeb</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF6EC;
      color: #12202B;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #E8F5E9;
      color: #0B5D3B;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px;
      color: #0B5D3B;
    }
    p {
      font-size: 13px;
      color: #4B5563;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background-color: #0B5D3B;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 14px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: #083D28;
    }
    .offline-tip {
      margin-top: 16px;
      font-size: 11px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You are in Dorm Offline Mode</h1>
    <p>No internet connection detected. Don't worry — all your unlocked exams and saved study materials remain accessible in your Library.</p>
    <a href="/dashboard/library" class="btn">Open My Library</a>
    <p class="offline-tip">Tibeb PWA works offline on Ethiopian mobile networks.</p>
  </div>
</body>
</html>
